name: Submissions

# Runs when a developer submits an app (issue titled "Submit: owner/app"),
# and when the store owner adds the "approved" label to a request.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: store-write

jobs:
  submission:
    if: >-
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, 'Submit:') &&
      (github.event.action != 'labeled' ||
       (github.event.label.name == 'approved' && github.event.sender.login == github.repository_owner))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
          gh label create approved --color 2da44e --description "Approved for the store" 2>/dev/null || true
          gh label create needs-review --color d29922 --description "Checks passed, waiting for the store owner" 2>/dev/null || true

      - name: Check the request
        id: check
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ACTION: ${{ github.event.action }}
        run: |
          MODE=check
          [ "$ACTION" = labeled ] && MODE=publish
          python3 tools/submit.py --mode "$MODE" --from-issue --result "$RUNNER_TEMP/result.json" --comment "$RUNNER_TEMP/comment.md" || true
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r '.ok // false' "$RUNNER_TEMP/result.json" 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          echo "trusted=$(jq -r '.trusted // false' "$RUNNER_TEMP/result.json" 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish automatically (developer already in the store)
        if: steps.check.outputs.mode == 'check' && steps.check.outputs.ok == 'true' && steps.check.outputs.trusted == 'true'
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 tools/submit.py --mode publish --from-issue --result "$RUNNER_TEMP/result.json" --comment "$RUNNER_TEMP/comment.md" || true

      - name: Save to the store
        shell: bash
        run: |
          if [ "$(jq -r '.published // false' "$RUNNER_TEMP/result.json" 2>/dev/null)" = true ]; then
            git config user.name "curie-store[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add store/store.json
            [ -d store/icons ] && git add store/icons || true
            git commit -m "Add $(jq -r '.summary.repo + " " + .summary.tag' "$RUNNER_TEMP/result.json")"
            git pull --rebase
            git push
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 || true
          fi

      - name: Reply
        if: always()
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/comment.md" ]; then
            printf 'Not added.\n```\nSomething went wrong on the store side. The store owner can see the details in the workflow log.\n```' > "$RUNNER_TEMP/comment.md"
            echo '{"ok":false}' > "$RUNNER_TEMP/result.json"
          fi
          gh issue comment "$NUM" --body-file "$RUNNER_TEMP/comment.md"
          OK=$(jq -r '.ok // false' "$RUNNER_TEMP/result.json")
          PUBLISHED=$(jq -r '.published // false' "$RUNNER_TEMP/result.json")
          if [ "$OK" = true ] && [ "$PUBLISHED" = true ]; then
            gh issue close "$NUM"
          elif [ "$OK" = true ]; then
            gh issue edit "$NUM" --add-label needs-review
          else
            gh issue edit "$NUM" --remove-label approved 2>/dev/null || true
          fi
