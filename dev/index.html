<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curie Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#0f172a;--mute:#667085;--line:#e3e8f0;--blue:#2447f5;--blue-ink:#fff;--chip:#e9eefb;--ok:#0b7a4b;--warn:#b54708;--bad:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#0a0e1a;--surface:#131a2b;--ink:#eef2fb;--mute:#8f9bb8;--line:#232d47;--blue:#6f8bff;--blue-ink:#0a0e1a;--chip:#1b2440;--ok:#4fd39a;--warn:#ffb86b;--bad:#ff7a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:900px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-h{display:flex;align-items:center;gap:12px;height:64px}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-right:auto;color:var(--ink);text-decoration:none}
.user{display:flex;align-items:center;gap:8px;font-size:.92rem}
.badge{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:500}
button,.btn{font-family:inherit;font-size:.95rem;font-weight:500;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;text-decoration:none;display:inline-block;text-align:center;line-height:1.2}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--blue);color:var(--blue-ink);font-weight:700}
.ghost{background:var(--chip);color:var(--ink)}
.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.small{padding:7px 14px;font-size:.88rem}
h1{font-size:1.7rem;letter-spacing:-.02em;margin:0}
h2{font-size:1.1rem;margin:0 0 4px}
.title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 18px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.sub{color:var(--mute);font-size:.86rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}.stat span{color:var(--mute);font-size:.85rem}
.list{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card+.card{margin-top:14px}
.head{display:flex;gap:14px;align-items:center}
.icon{width:56px;height:56px;border-radius:22%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.4rem;flex:none}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:.8rem;font-weight:500;border-radius:999px;padding:4px 12px}
.p-live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-queued,.p-checking,.p-review,.p-publishing{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.p-failed{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.track{display:flex;margin:20px 0 4px}
.step{flex:1;position:relative;text-align:center;font-size:.75rem;color:var(--mute)}
.step::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.dot{width:20px;height:20px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1;display:grid;place-items:center;color:var(--blue-ink);font-size:.7rem;font-weight:700}
.step.done .dot{background:var(--blue)}.step.done::before,.step.now::before{background:var(--blue)}
.step.now .dot{background:var(--surface);border:2px solid var(--blue)}.step.now{color:var(--ink);font-weight:500}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.9rem;background:var(--chip);word-break:break-word}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.note.warn{background:color-mix(in srgb,var(--warn) 12%,transparent)}
label.f{display:block;font-weight:500;font-size:.9rem;margin:16px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
textarea{resize:vertical;min-height:84px}
.count{float:right;color:var(--mute);font-size:.8rem;font-weight:400}
.drop{display:block;border:2px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--blue)}
.drop-t{font-weight:700}
.uprow{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem;white-space:nowrap}
.tab.on{background:var(--blue);color:var(--blue-ink)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.shot{border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;background:var(--bg)}
.shot img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.shot .row{justify-content:center;margin-top:6px}
.ver{padding:14px 0;border-top:1px solid var(--line)}.ver:first-child{border-top:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.9rem}.kv span{color:var(--mute)}.kv code{font:12px/1.5 ui-monospace,monospace;word-break:break-all}
.perm{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.78rem;margin:2px 4px 2px 0}.perm.hot{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.check{display:flex;gap:10px;padding:6px 0;font-size:.92rem}.check b{flex:none;width:1.2em}
.signin{max-width:400px;margin:10vh auto 0}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-top:8px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:14px 0}
@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
#toasts{position:fixed;left:0;right:0;bottom:16px;display:grid;gap:8px;justify-items:center;pointer-events:none;z-index:50}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 18px;font-size:.92rem;max-width:90vw}.toast.bad{background:var(--bad);color:#fff}
dialog{width:min(440px,100%);border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;margin:auto}
dialog::backdrop{background:rgba(8,12,24,.6)}
.publishbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 0;margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){.stats{gap:8px}.stat{padding:12px}.kv{grid-template-columns:1fr}dialog{margin:auto 0 0;border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
const CFG={PUBLISH:'https://rocurity--56bf8ed8ca1f11f1a62d1607ee4eb77e.web.val.run',CURIE:'https://rocurity--40be21cebf4011f199401607ee4eb77e.web.val.run',STORE:'https://rocurity--d6f12a7ac46211f19d8c1607ee4eb77e.web.val.run',SIGNUP:'https://curie-id-c579e.web.app'};
const MB=1048576,LIM={apk:150*MB,icon:1*MB,shot:3*MB},CATS=['tools','productivity','media','games','social','education','security'];
const SENSITIVE=['CAMERA','RECORD_AUDIO','READ_SMS','SEND_SMS','RECEIVE_SMS','READ_CONTACTS','WRITE_CONTACTS','READ_CALL_LOG','CALL_PHONE','READ_PHONE_STATE','ACCESS_FINE_LOCATION','ACCESS_BACKGROUND_LOCATION','SYSTEM_ALERT_WINDOW','REQUEST_INSTALL_PACKAGES','BIND_ACCESSIBILITY_SERVICE','MANAGE_EXTERNAL_STORAGE','QUERY_ALL_PACKAGES','READ_EXTERNAL_STORAGE'];
const STATUS={queued:'Checking',checking:'Checking',review:'Waiting for approval',publishing:'Publishing',live:'Live',failed:'Needs attention'};
const STEPS=['Checking','Approval','Publishing','Live'],POS={queued:0,checking:0,review:1,publishing:2,live:4};

// ---------- helpers ----------
const $=id=>document.getElementById(id);
function h(t,at={},...kids){const e=document.createElement(t);
  for(const[k,v]of Object.entries(at)){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e[k]=v;else if(v===true)e.setAttribute(k,'');else if(k==='value')e.value=v;else e.setAttribute(k,v)}
  for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c);return e}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const size=b=>b>=MB?(b/MB).toFixed(b>=10*MB?0:1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const when=t=>{try{return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch{return''}};
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const safeImg=u=>typeof u==='string'&&/^https:\/\//.test(u)?u:'';
function toast(msg,bad){const t=h('div',{class:'toast'+(bad?' bad':''),role:'status'},msg);$('toasts').append(t);setTimeout(()=>t.remove(),bad?6000:3500)}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const getSession=()=>{try{return JSON.parse(store.get('curie-session')||'null')}catch{return null}};
const saveSession=v=>v?store.set('curie-session',JSON.stringify(v)):store.del('curie-session');
const deviceId=()=>{let d=store.get('curieDeviceId');if(!d){d='curie-store-web-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2));store.set('curieDeviceId',d)}return d};
function tile(name,id,url,px){
  const x=hue(id||name),box=h('div',{class:'icon','aria-hidden':'true'},(name||'?')[0].toUpperCase());
  box.style.background=`linear-gradient(145deg,hsl(${x} 75% 58%),hsl(${(x+40)%360} 70% 42%))`;box.style.width=box.style.height=px+'px';
  if(safeImg(url)){const i=h('img',{class:'icon',src:url,alt:''});i.style.width=i.style.height=px+'px';i.onerror=()=>i.replaceWith(box);return i}
  return box}
function pill(status){return h('span',{class:'pill p-'+status},STATUS[status]||status)}
function track(status){
  const c=POS[status];if(c===undefined)return null;
  return h('div',{class:'track'},STEPS.map((s,i)=>{const cls=i<c?'done':i===c?'now':'';return h('div',{class:'step '+cls},h('div',{class:'dot'},cls==='done'?'✓':''),s)}))}

// ---------- dialogs ----------
function ask({title,text,confirm='OK',danger=false,typeToConfirm='',input=null}){
  return new Promise(res=>{
    const d=h('dialog',{});let field=null;
    const ok=h('button',{class:danger?'danger':'primary'},confirm);
    if(typeToConfirm){field=h('input',{type:'text',autocomplete:'off','aria-label':'Type to confirm'});ok.disabled=true;field.oninput=()=>{ok.disabled=field.value.trim()!==typeToConfirm}}
    if(input){field=h('textarea',{placeholder:input,maxlength:'200'})}
    const done=v=>{d.close();d.remove();res(v)};
    ok.onclick=()=>done(input?field.value.trim()||true:true);
    d.append(h('h2',{},title),h('p',{class:'sub'},text),typeToConfirm?h('p',{class:'sub'},'Type ',h('b',{},typeToConfirm),' to confirm.'):'',field||'',
      h('div',{class:'row',style:{marginTop:'18px'}},ok,h('button',{class:'ghost',onclick:()=>done(false)},'Cancel')));
    d.addEventListener('cancel',e=>{e.preventDefault();done(false)});
    document.body.append(d);d.showModal()})}

// ---------- state and API ----------
const S={me:null,apps:[],subs:[],stats:{},admin:false,poll:null,leaving:0};
async function api(method,path,body){
  const headers={Authorization:'Bearer '+(S.me&&S.me.token)};if(body!==undefined)headers['Content-Type']='application/json';
  let r;try{r=await fetch(CFG.PUBLISH+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}catch{throw new Error('Could not reach the store. Check your connection.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401){signOut('Your sign-in expired. Please sign in again.');throw new Error('Your sign-in expired.')}
  if(!r.ok)throw new Error(j.error||'Something went wrong');
  return j}
async function capi(path,opts={}){const r=await fetch(CFG.CURIE+path,{cache:'no-store',...opts,headers:{'Content-Type':'text/plain',...(opts.headers||{})}});return{status:r.status,ok:r.ok,data:await r.json().catch(()=>({}))}}
function signOut(note){S.me=null;saveSession(null);clearInterval(S.poll);S.apps=[];S.subs=[];render(note)}

async function loadAll(){
  const [apps,subs]=await Promise.all([api('GET','/apps?all=1'),api('GET','/submissions?all=1')]);
  S.admin=!!apps.admin;S.apps=apps.apps;S.subs=subs.submissions;
  try{const r=await fetch(CFG.STORE+'/stats');S.stats=(await r.json()).apps||{}}catch{S.stats={}}}
const mine=()=>S.apps.filter(a=>a.owner===S.me.curieId);
const mySubs=()=>S.subs.filter(s=>!s.owner||s.owner===S.me.curieId);
const recent=s=>Date.now()-s.updatedAt<14*86400000;
const active=s=>['queued','checking','review','publishing'].includes(s.status);
const stalled=s=>active(s)&&s.status!=='review'&&Date.now()-s.updatedAt>5*60000;
async function retry(s,btn){btn.disabled=true;try{await api('POST',`/submissions/${s.id}/retry`);toast('Trying again…');await loadAll();await route()}catch(e){toast(e.message,true);btn.disabled=false}}
const stallNote=s=>stalled(s)?h('div',{class:'note warn'},'This is taking longer than usual. ',h('button',{class:'ghost small',onclick:e=>retry(s,e.target)},'Try again')):'';
const liveMsg=s=>active(s)&&s.status!=='review'&&s.message&&!/^(Publishing|Checking the app)$/.test(s.message)?h('div',{class:'sub',style:{marginTop:'8px'}},s.message):'';

// ---------- uploads (straight to the private bucket; progress; retry) ----------
function checkFile(kind,f){
  const n=f.name.toLowerCase();
  if(kind==='apk'){if(!n.endsWith('.apk'))return'That is not an APK file. Choose the .apk you built.';}
  else if(!/\.(png|jpe?g|webp)$/.test(n)||!/^image\/(png|jpeg|webp)$/.test(f.type))return'Pictures must be PNG, JPG or WebP.';
  if(f.size>LIM[kind])return`That file is too large (${size(f.size)}). The limit is ${Math.round(LIM[kind]/MB)} MB.`;
  return''}
async function prepImage(kind,f){
  if(typeof createImageBitmap!=='function')return f;
  try{const bmp=await createImageBitmap(f),max=kind==='icon'?512:1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(scale===1&&f.size<=LIM[kind])return f;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const type=kind==='icon'?'image/png':'image/jpeg',blob=await new Promise(r=>c.toBlob(r,type,.88));if(!blob)return f;
    return new File([blob],f.name.replace(/\.[^.]+$/,'')+(kind==='icon'?'.png':'.jpg'),{type})}catch{return f}}
function putFile(url,file,onProgress,handle){
  return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',url);
    x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};
    x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error(x.status===403?'The upload link expired. Try again.':'Upload failed ('+x.status+'). Try again.'));
    x.onerror=()=>rej(new Error('Network error. Check your connection and try again.'));x.onabort=()=>rej(new Error('Cancelled'));
    if(handle)handle.cancel=()=>x.abort();x.send(file)})}
async function uploadFile(kind,file,onProgress,handle){
  const s=await api('POST','/uploads',{kind,filename:file.name,size:file.size,contentType:file.type||'application/vnd.android.package-archive'});
  await putFile(s.uploadUrl,file,onProgress,handle);
  await api('POST',`/uploads/${s.id}/complete`);return s.id}
/** A row that shows one file going up. run() resolves with the upload id, or rejects. */
function uploader(kind,file,onState){
  const fill=h('i'),bar=h('div',{class:'bar'},fill),st=h('span',{class:'sub'},'Waiting');
  const retry=h('button',{class:'ghost small',style:{display:'none'}},'Try again'),cancel=h('button',{class:'ghost small'},'Cancel');
  const row=h('div',{class:'uprow'},h('div',{class:'grow'},h('div',{class:'name'},file.name),h('div',{class:'sub'},size(file.size)),bar),st,retry,cancel);
  const u={row,id:null,state:'idle',handle:{},
    async run(){
      u.state='uploading';retry.style.display='none';cancel.style.display='';st.textContent='Uploading 0%';fill.style.width='0%';S.leaving++;if(onState)onState();
      try{u.id=await uploadFile(kind,file,p=>{fill.style.width=Math.round(p*100)+'%';st.textContent='Uploading '+Math.round(p*100)+'%'},u.handle);
        u.state='done';fill.style.width='100%';st.textContent='✓ Uploaded';cancel.style.display='none';return u.id}
      catch(e){u.state='failed';st.textContent=e.message;st.style.color='var(--bad)';retry.style.display='';cancel.style.display='none';throw e}
      finally{S.leaving--;if(onState)onState()}}};
  retry.onclick=()=>{st.style.color='';u.run().catch(()=>{})};cancel.onclick=()=>{if(u.handle.cancel)u.handle.cancel()};
  return u}
window.addEventListener('beforeunload',e=>{if(S.leaving>0){e.preventDefault();e.returnValue=''}});
function dropZone({label,hint,accept,multiple,onFiles}){
  const inp=h('input',{type:'file',accept,multiple:!!multiple,class:'sr',tabindex:'-1'});
  const z=h('label',{class:'drop',tabindex:'0'},h('div',{class:'drop-t'},label),h('div',{class:'sub'},hint),inp);
  inp.onchange=()=>{const f=[...inp.files];inp.value='';if(f.length)onFiles(f)};
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const f=[...((e.dataTransfer&&e.dataTransfer.files)||[])];if(f.length)onFiles(multiple?f:f.slice(0,1))};
  z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};return z}
const catSelect=v=>{const s=h('select',{'aria-label':'Category'},CATS.map(c=>h('option',{value:c},cap(c))));s.value=CATS.includes(v)?v:'tools';return s};
function counted(el,max){const c=h('span',{class:'count'},'');const upd=()=>{c.textContent=el.value.length+'/'+max};el.addEventListener('input',upd);upd();return c}

// ---------- Curie ID sign-in ----------
function signInView(note){
  const wrap=h('div',{class:'wrap signin'});
  const draw=(...kids)=>{wrap.replaceChildren(h('div',{class:'brand'},'Curie Developers'),...kids)};
  const form=()=>{
    const id=h('input',{type:'text',placeholder:'Curie ID or username',autocomplete:'username',autocapitalize:'none','aria-label':'Curie ID or username'});
    const pw=h('input',{type:'password',placeholder:'Password',autocomplete:'current-password','aria-label':'Password'});
    const err=h('div',{class:'err',role:'alert'},note||''),go=h('button',{class:'primary',style:{width:'100%',marginTop:'14px'}},'Sign in');
    const run=async()=>{
      const ident=id.value.trim().toLowerCase();if(!ident||!pw.value){err.textContent='Enter your Curie ID or username, and password';return}
      go.disabled=true;go.textContent='Signing in';err.textContent='';
      try{const r=await capi('/login',{method:'POST',body:JSON.stringify({identifier:ident,password:pw.value,deviceId:deviceId()})});pw.value='';
        if(r.status===202)return wait(r.data);if(!r.ok)throw new Error(r.data.error||'Sign-in failed');await finish(r.data)}
      catch(e){err.textContent=e.message;go.disabled=false;go.textContent='Sign in'}};
    go.onclick=run;pw.onkeydown=e=>{if(e.key==='Enter')run()};
    draw(h('h1',{style:{margin:'18px 0'}},'Sign in with Curie ID'),id,h('div',{style:{height:'10px'}}),pw,err,go,
      h('p',{class:'sub',style:{textAlign:'center',marginTop:'16px'}},h('a',{href:CFG.SIGNUP,rel:'noopener'},'Create a Curie ID')))};
  let alive=true,done=false;
  const finish=async d=>{if(done)return;done=true;alive=false;
    let me={token:d.accessToken,curieId:d.curieId};
    try{const r=await capi('/me',{headers:{Authorization:'Bearer '+d.accessToken}});if(r.ok){me.displayName=r.data.displayName;me.username=r.data.username}}catch{}
    S.me=me;saveSession(me);render()};
  const wait=info=>{
    const err=h('div',{class:'err',role:'alert'});

    root.replaceChildren(backLink('#/','Your apps'),h('div',{class:'title'},h('h1',{},'Owner tools')),
      h('h2',{},'Waiting for approval'),q,h('h2',{style:{marginTop:'28px'}},'All apps in the store'),h('section',{class:'card'},apps.length?apps:h('p',{class:'sub',style:{margin:0}},'No apps.')),
      h('h2',{style:{marginTop:'28px'}},'Recent uploads'),h('section',{class:'card'},recentSubs.length?recentSubs.map(s=>h('div',{class:'ver'},h('div',{class:'row'},h('div',{class:'grow'},h('b',{},s.name||s.appId||'Untitled'),h('div',{class:'sub'},`${s.username||''} · ${when(s.createdAt)}${s.message&&['failed','queued','checking','publishing'].includes(s.status)?' · '+s.message:''}`)),stalled(s)?h('button',{class:'ghost small',onclick:e=>retry(s,e.target)},'Try again'):'',pill(s.status)))):h('p',{class:'sub',style:{margin:0}},'Nothing yet.')),
      h('h2',{style:{marginTop:'28px'}},'Connections'),h('section',{class:'card'},h('p',{class:'sub',style:{marginTop:0}},'Checks Backblaze, GitHub and Curie ID, and shows what to fix if something is wrong.'),test,checks))};
  draw();
  loadAll().then(()=>{if(document.body.contains(root)&&location.hash.startsWith('#/review'))draw()}).catch(()=>{})}

// ---------- router ----------
async function route(){
  clearInterval(S.poll);if(!S.me)return;
  const root=$('main');if(!root)return;
  const p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo&&window.scrollTo(0,0);
  if(p[0]==='new')return viewNew(root);
  if(p[0]==='app'&&p[1])return viewApp(root,decodeURIComponent(p[1]),p[2]||'details');
  if(p[0]==='review')return viewReview(root);
  return viewApps(root)}
async function render(note){
  const app=$('app');
  if(!S.me){app.replaceChildren(signInView(note));return}
  app.replaceChildren(h('div',{class:'wrap',style:{paddingTop:'40px'}},h('div',{class:'spin'})));
  try{await loadAll()}catch(e){if(S.me)app.replaceChildren(h('div',{class:'wrap',style:{paddingTop:'40px'}},h('div',{class:'card'},e.message),h('button',{class:'primary',style:{marginTop:'12px'},onclick:()=>render()},'Try again')));return}
  app.replaceChildren(shell(h('div',{})));await route()}
window.addEventListener('hashchange',route);
(async function boot(){
  const s=getSession();
  if(s&&s.token){try{const r=await capi('/me',{headers:{Authorization:'Bearer '+s.token}});if(r.ok){S.me={...s,displayName:r.data.displayName||s.displayName,username:r.data.username||s.username}}else{saveSession(null)}}catch{S.me=s}}
  render(!S.me&&s?'Your sign-in expired. Please sign in again.':'')})();
</script>
