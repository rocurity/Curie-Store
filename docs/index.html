<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curie Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#eef2f8;--card:#fff;--line:#d3dbe9;--blue:#2447f5;--mute:#5a6785;--ok:#0b7a4b}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf8;--paper:#0e1526;--card:#16203a;--line:#2a3658;--blue:#7d95ff;--mute:#9aa7c7;--ok:#4fd39a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:48px 20px 24px;max-width:1000px;margin:auto}
h1{font:700 clamp(2.4rem,7vw,4rem)/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.03em}
header p{margin:0;color:var(--mute);max-width:46ch}
.bar{max-width:1000px;margin:0 auto;padding:0 20px 16px;display:flex;gap:10px;flex-wrap:wrap}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input{flex:1;min-width:200px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--blue)}
.top{display:flex;gap:12px;align-items:center}
.icon{width:48px;height:48px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 22px "Bricolage Grotesque",sans-serif;flex:none}
.name{font:700 1.1rem "Bricolage Grotesque",sans-serif}
.meta{color:var(--mute);font-size:.88rem}
.desc{font-size:.95rem;margin:0}
.ok{color:var(--ok);font-weight:500}
dialog{max-width:560px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:24px}
dialog::backdrop{background:rgba(10,15,30,.55)}
dl{margin:16px 0;display:grid;gap:10px}
dt{font-weight:500;font-size:.85rem;color:var(--mute)}
dd{margin:0;word-break:break-all}
code{font:13px ui-monospace,monospace}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;text-decoration:none;border:0;border-radius:8px;padding:11px 18px;font:500 1rem inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.empty{grid-column:1/-1;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Curie Store</h1>
  <p>Open-source Android apps, installed straight from their developers' GitHub releases. Every download shows its signing fingerprint.</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search apps, developers, categories" aria-label="Search">
  <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  <select id="sort" aria-label="Sort"><option value="name">Name</option></select>
</div>
<main id="grid" aria-live="polite"></main>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='onclick')e.onclick=v;else e.setAttribute(k,v)}
  for(const c of kids.flat())e.append(c);return e}
const mb=b=>b>0?(b/1048576).toFixed(1)+' MB':'size unknown';
const safeUrl=u=>/^https:\/\/github\.com\//.test(u)?u:'#';
const shortPerm=p=>p.replace('android.permission.','');
let apps=[];
function render(){
  const q=$('q').value.toLowerCase(),c=$('cat').value,g=$('grid');g.replaceChildren();
  const list=apps.filter(a=>(!c||a.category===c)&&(a.name+a.author+a.category+a.description).toLowerCase().includes(q));
  if(!list.length){g.append(h('p',{class:'empty'},'No apps match. Clear the search or pick another category.'));return}
  for(const a of list){
    g.append(h('button',{class:'card',onclick:()=>open(a)},
      h('div',{class:'top'},h('div',{class:'icon','aria-hidden':'true'},a.name[0]),
        h('div',{},h('div',{class:'name'},a.name),h('div',{class:'meta'},'by '+a.author+' · v'+a.latest.version))),
      h('p',{class:'desc'},a.description),
      h('div',{class:'meta'},a.category+' · '+mb(a.latest.sizeBytes))));
  }
}
function open(a){
  const l=a.latest,d=$('dlg');d.replaceChildren(
    h('h2',{class:'name'},a.name),
    h('div',{class:'meta'},'by '+a.author+' · v'+l.version+' · '+mb(l.sizeBytes)),
    h('p',{},a.description),
    h('dl',{},
      h('dt',{},'Permissions'),h('dd',{},l.permissions.length?l.permissions.map(shortPerm).join(', '):'None requested'),
      h('dt',{},'APK SHA-256'),h('dd',{},h('code',{},l.sha256)),
      h('dt',{},'Signing certificate SHA-256'),h('dd',{},h('code',{},l.certSha256)),
      h('dt',{},'Source'),h('dd',{},h('a',{href:'https://github.com/'+encodeURI(a.repo),rel:'noopener'},'github.com/'+a.repo))),
    h('div',{class:'row'},
      h('a',{class:'btn',href:safeUrl(l.apkUrl),rel:'noopener'},'Download APK'),
      h('button',{class:'btn alt',onclick:()=>d.close()},'Close')));
  d.showModal();
}
fetch('store.json').then(r=>r.json()).then(s=>{
  apps=s.apps;
  [...new Set(apps.map(a=>a.category))].sort().forEach(c=>$('cat').append(h('option',{value:c},c)));
  render();
}).catch(()=>$('grid').append(h('p',{class:'empty'},'Could not load store.json. Check that it is in the same folder as this page.')));
$('q').oninput=render;$('cat').onchange=render;
</script>
</body>
</html>
