<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curie Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#0f172a;--mute:#667085;--line:#e3e8f0;--blue:#2447f5;--blue-ink:#fff;--chip:#e9eefb}
@media(prefers-color-scheme:dark){:root{--bg:#0a0e1a;--surface:#131a2b;--ink:#eef2fb;--mute:#8f9bb8;--line:#232d47;--blue:#6f8bff;--blue-ink:#0a0e1a;--chip:#1b2440}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "DM Sans",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:auto;padding:0 20px}
.head{display:flex;align-items:center;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:30px;height:30px}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 42px}
.search svg{position:absolute;left:14px;top:11px;width:18px;height:18px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.chip{flex:none;font:500 .9rem inherit;color:var(--ink);background:var(--chip);border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;padding:20px 12px 60px;max-width:1040px;margin:auto}
.tile{background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:12px;border-radius:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:hover{background:var(--surface)}
.icon{width:100%;max-width:92px;aspect-ratio:1;border-radius:22%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;font-size:2rem;flex:none;box-shadow:0 1px 3px rgba(15,23,42,.18)}
.name{font-weight:500;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:60px 0}
dialog{width:min(520px,100%);max-height:88vh;border:0;border-radius:24px;background:var(--surface);color:var(--ink);padding:24px;margin:auto}
@media(max-width:600px){dialog{margin:auto 0 0;border-radius:24px 24px 0 0}}
dialog::backdrop{background:rgba(8,12,24,.6)}
.top{display:flex;gap:16px;align-items:center}
.top .icon{width:84px;max-width:84px}
.top h2{margin:0;font-size:1.4rem;letter-spacing:-.02em}
.x{margin-left:auto;align-self:flex-start;background:var(--chip);color:var(--ink);border:0;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.install{display:block;width:100%;margin:20px 0;text-align:center;text-decoration:none;background:var(--blue);color:var(--blue-ink);font-weight:700;padding:13px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-block:1px solid var(--line);padding:12px 0}
.stats b{display:block;font-size:1rem}.stats span{color:var(--mute);font-size:.8rem}
h3{font-size:.95rem;margin:20px 0 8px}
.perms{display:flex;flex-wrap:wrap;gap:6px}
.perms span{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.82rem}
code{display:block;font:12px/1.5 ui-monospace,monospace;color:var(--mute);word-break:break-all}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="var(--blue)" stroke-width="2" aria-hidden="true"><ellipse cx="16" cy="16" rx="13" ry="5"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(120 16 16)"/><circle cx="16" cy="16" r="2.5" fill="var(--blue)" stroke="none"/></svg>
      Curie Store
    </div>
    <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search apps"></label>
  </div>
  <div class="chips" id="chips"></div>
</div></header>
<main id="grid"></main>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id);
function h(t,at={},...kids){const e=document.createElement(t);
  for(const[k,v]of Object.entries(at)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}
  for(const c of kids.flat())e.append(c);return e}
const mb=b=>b>0?(b/1048576).toFixed(b<10485760?1:0)+' MB':'—';
const safeApk=u=>/^https:\/\/github\.com\//.test(u)?u:'#';
const safeIcon=u=>/^icons\/[\w.\-]+$/.test(u||'')?u:'';
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
function icon(a){
  const letter=()=>{const e=h('div',{class:'icon','aria-hidden':'true'},a.name[0].toUpperCase());
    const x=hue(a.id);e.style.background=`linear-gradient(145deg,hsl(${x} 75% 58%),hsl(${(x+40)%360} 70% 42%))`;return e};
  const src=safeIcon(a.icon);if(!src)return letter();
  const i=h('img',{class:'icon',src,alt:'',loading:'lazy'});i.onerror=()=>i.replaceWith(letter());return i}
const CATS=['tools','productivity','media','games','social','education','security'];
const cap=t=>t[0].toUpperCase()+t.slice(1);
let apps=[],cat='';
function render(){
  const q=$('q').value.toLowerCase(),g=$('grid');g.replaceChildren();
  const list=apps.filter(a=>(!cat||a.category===cat)&&(a.name+' '+a.author+' '+a.category).toLowerCase().includes(q));
  if(!list.length){g.append(h('p',{class:'empty'},'No apps found'));return}
  for(const a of list)g.append(h('button',{class:'tile',onclick:()=>show(a)},icon(a),
    h('div',{class:'name'},a.name),h('div',{class:'sub'},a.author+' · '+mb(a.latest.sizeBytes))));
}
function show(a){
  const l=a.latest,d=$('dlg'),perms=l.permissions.map(p=>p.replace('android.permission.',''));
  d.replaceChildren(
    h('div',{class:'top'},icon(a),h('div',{},h('h2',{},a.name),h('div',{class:'sub'},a.author)),
      h('button',{class:'x','aria-label':'Close',onclick:()=>d.close()},'✕')),
    h('a',{class:'install',href:safeApk(l.apkUrl),rel:'noopener'},'Install'),
    h('div',{class:'stats'},h('div',{},h('b',{},l.version),h('span',{},'Version')),
      h('div',{},h('b',{},mb(l.sizeBytes)),h('span',{},'Size')),h('div',{},h('b',{},cap(a.category)),h('span',{},'Category'))),
    a.description?h('p',{},a.description):'',
    h('h3',{},'Permissions'),
    perms.length?h('div',{class:'perms'},perms.map(p=>h('span',{},p))):h('div',{class:'sub'},'None'),
    h('h3',{},'Signed by'),h('code',{},l.certSha256),
    h('h3',{},'Checksum'),h('code',{},l.sha256));
  d.showModal();
}
$('dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
function chips(){
  const cats=[...new Set([...CATS,...apps.map(a=>a.category)])],box=$('chips');box.replaceChildren();
  for(const c of ['',...cats])box.append(h('button',{class:'chip','aria-pressed':String(c===cat),
    onclick:()=>{cat=c;chips();render()}},c?cap(c):'All'));
}
fetch('store.json').then(r=>r.json()).then(s=>{apps=s.apps;chips();render()})
  .catch(()=>$('grid').append(h('p',{class:'empty'},'Store unavailable')));
$('q').oninput=render;
</script>
</body>
</html>
